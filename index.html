
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON SLITHER</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@400;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #070910;
    color: white;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse at 50% 40%, #151a39 0%, transparent 65%);
    pointer-events: none;
}

.game {
    width: 100%;
    max-width: 540px;
    position: relative;
    z-index: 1;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 2px;
}

.logo span {
    color: #38d9ff;
    text-shadow: 0 0 15px #38d9ff;
}

.status {
    color: #777f9d;
    font-size: 11px;
    letter-spacing: 2px;
}

.stats {
    display: flex;
    gap: 12px;
    margin-bottom: 15px;
}

.stat {
    flex: 1;
    background: #111522;
    border: 1px solid #242b42;
    border-radius: 12px;
    padding: 14px;
}

.stat small {
    display: block;
    color: #747d98;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 6px;
}

.stat strong {
    font-family: 'Orbitron', sans-serif;
    font-size: 23px;
}

#score {
    color: #38d9ff;
}

#best {
    color: #b18aff;
}

.board {
    position: relative;
    background: #090e19;
    border: 1px solid #293653;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 35px #1684ff12;
}

canvas {
    width: 100%;
    display: block;
    aspect-ratio: 1;
}

.overlay {
    position: absolute;
    inset: 0;
    background: #070910bd;
    backdrop-filter: blur(5px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

.overlay.hidden {
    display: none;
}

.overlay h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(24px, 7vw, 36px);
    color: #38d9ff;
    text-shadow: 0 0 20px #38d9ff;
    margin-bottom: 12px;
}

.overlay p {
    color: #9ba6c4;
    font-size: 13px;
    line-height: 1.8;
    margin-bottom: 22px;
}

button {
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: .2s;
}

.primary {
    background: #38d9ff;
    color: #07101c;
    border: none;
    border-radius: 9px;
    padding: 14px 30px;
    font-weight: 800;
    letter-spacing: 1px;
    box-shadow: 0 0 22px #38d9ff55;
}

.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px #38d9ff99;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.secondary {
    flex: 1;
    background: #111522;
    border: 1px solid #293653;
    color: white;
    padding: 13px;
    border-radius: 9px;
    font-size: 12px;
}

.secondary:hover {
    border-color: #38d9ff;
}

.instructions {
    text-align: center;
    color: #68738e;
    font-size: 11px;
    margin-top: 18px;
    letter-spacing: 1px;
}

.controls {
    display: none;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 52px);
    justify-content: center;
    gap: 7px;
    margin-top: 20px;
}

.controls button {
    background: #151c2e;
    color: #38d9ff;
    border: 1px solid #293653;
    border-radius: 12px;
    font-size: 21px;
    touch-action: none;
}

.controls button:active {
    background: #263d60;
}

.up { grid-column: 2; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }

.footer {
    text-align: center;
    color: #414c66;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 24px;
}

@media (max-width: 600px) {
    .controls {
        display: grid;
    }
    .instructions {
        display: none;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <div class="logo">NEON <span>SLITHER</span></div>
        <div class="status">ARCADE MODE</div>
    </div>

    <div class="stats">
        <div class="stat">
            <small>SCORE</small>
            <strong id="score">000</strong>
        </div>
        <div class="stat">
            <small>BEST</small>
            <strong id="best">000</strong>
        </div>
    </div>

    <div class="board">
        <canvas id="canvas" width="500" height="500"></canvas>

        <div class="overlay" id="overlay">
            <h1 id="overlayTitle">NEON SLITHER</h1>
            <p id="overlayText">
                Collect energy. Grow longer.<br>
                Don't hit yourself.
            </p>
            <button class="primary" id="startBtn">START GAME</button>
        </div>
    </div>

    <div class="actions">
        <button class="secondary" id="pauseBtn">Ⅱ &nbsp; PAUSE</button>
        <button class="secondary" id="restartBtn">↻ &nbsp; RESTART</button>
    </div>

    <div class="instructions">
        USE ARROW KEYS OR WASD TO MOVE
    </div>

    <div class="controls">
        <button class="up" data-dir="up">↑</button>
        <button class="left" data-dir="left">←</button>
        <button class="down" data-dir="down">↓</button>
        <button class="right" data-dir="right">→</button>
    </div>

    <div class="footer">
        NEON SLITHER &nbsp; • &nbsp; VERSION 1.0
    </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const SIZE = 500;
const CELL = 25;
const COUNT = SIZE / CELL;

let snake, food, bonus;
let direction, nextDirection;
let score = 0;
let best = Number(localStorage.getItem("neonBest")) || 0;
let running = false;
let paused = false;
let gameOver = false;
let lastTime = 0;
let elapsed = 0;
let bonusTimer = 0;
let particles = [];

document.getElementById("best").textContent =
    String(best).padStart(3, "0");

function reset() {
    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10},
        {x: 7, y: 10}
    ];

    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};

    score = 0;
    bonus = null;
    bonusTimer = 0;
    elapsed = 0;
    particles = [];

    updateScore();
    spawnFood();

    running = true;
    paused = false;
    gameOver = false;

    document.getElementById("overlay").classList.add("hidden");
    document.getElementById("pauseBtn").textContent = "Ⅱ  PAUSE";
}

function spawnFood() {
    food = randomPosition();
}

function randomPosition() {
    let p;

    do {
        p = {
            x: Math.floor(Math.random() * COUNT),
            y: Math.floor(Math.random() * COUNT)
        };
    } while (
        snake.some(s => s.x === p.x && s.y === p.y) ||
        (bonus && bonus.x === p.x && bonus.y === p.y)
    );

    return p;
}

function updateScore() {
    document.getElementById("score").textContent =
        String(score).padStart(3, "0");

    if (score > best) {
        best = score;
        localStorage.setItem("neonBest", best);
        document.getElementById("best").textContent =
            String(best).padStart(3, "0");
    }
}

function setDirection(x, y) {
    if (!running || paused) return;

    if (x === -direction.x && y === -direction.y) return;

    nextDirection = {x, y};
}

document.addEventListener("keydown", e => {
    const keys = {
        ArrowUp: [0, -1],
        w: [0, -1],
        ArrowDown: [0, 1],
        s: [0, 1],
        ArrowLeft: [-1, 0],
        a: [-1, 0],
        ArrowRight: [1, 0],
        d: [1, 0]
    };

    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;

    if (keys[key]) {
        e.preventDefault();
        setDirection(...keys[key]);
    }

    if (e.code === "Space") {
        e.preventDefault();
        togglePause();
    }
});

document.querySelectorAll(".controls button").forEach(button => {
    button.addEventListener("pointerdown", e => {
        e.preventDefault();

        const directions = {
            up: [0, -1],
            down: [0, 1],
            left: [-1, 0],
            right: [1, 0]
        };

        setDirection(...directions[button.dataset.dir]);
    });
});

document.getElementById("startBtn").onclick = reset;
document.getElementById("restartBtn").onclick = reset;

document.getElementById("pauseBtn").onclick = togglePause;

function togglePause() {
    if (!running || gameOver) return;

    paused = !paused;

    document.getElementById("pauseBtn").textContent =
        paused ? "▶ RESUME" : "Ⅱ PAUSE";

    if (paused) {
        showOverlay("PAUSED", "Take a breather.", "RESUME", togglePause);
    } else {
        document.getElementById("overlay").classList.add("hidden");
    }
}

function showOverlay(title, message, buttonText, action) {
    document.getElementById("overlayTitle").textContent = title;
    document.getElementById("overlayText").innerHTML = message;
    const btn = document.getElementById("startBtn");
    btn.textContent = buttonText;
    btn.onclick = action;
    document.getElementById("overlay").classList.remove("hidden");
}

function endGame() {
    running = false;
    gameOver = true;

    showOverlay(
        "GAME OVER",
        `You scored <b style="color:#38d9ff">${score}</b> points.<br>Think you can beat that?`,
        "PLAY AGAIN",
        reset
    );
}

function addParticles(x, y, color) {
    for (let i = 0; i < 9; i++) {
        particles.push({
            x: x * CELL + CELL / 2,
            y: y * CELL + CELL / 2,
            vx: (Math.random() - .5) * 5,
            vy: (Math.random() - .5) * 5,
            life: 1,
            color
        });
    }
}

function update() {
    if (!running || paused) return;

    direction = {...nextDirection};

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    if (
        head.x < 0 || head.x >= COUNT ||
        head.y < 0 || head.y >= COUNT
    ) {
        endGame();
        return;
    }

    const eating = head.x === food.x && head.y === food.y;
    const eatingBonus = bonus &&
        head.x === bonus.x && head.y === bonus.y;

    const body = eating || eatingBonus ? snake : snake.slice(0, -1);

    if (body.some(s => s.x === head.x && s.y === head.y)) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (eating) {
        score += 10;
        addParticles(food.x, food.y, "#38d9ff");
        spawnFood();
        updateScore();

        if (score % 50 === 0) {
            bonus = randomPosition();
            bonusTimer = 8;
        }
    } else if (eatingBonus) {
        score += 30;
        addParticles(bonus.x, bonus.y, "#b18aff");
        bonus = null;
        updateScore();
    } else {
        snake.pop();
    }
}

function drawGrid() {
    ctx.strokeStyle = "#172238";
    ctx.lineWidth = 1;

    for (let i = 0; i <= COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, SIZE);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(SIZE, i * CELL);
        ctx.stroke();
    }
}

function drawOrb(position, color, radius, time) {
    const x = position.x * CELL + CELL / 2;
    const y = position.y * CELL + CELL / 2;
    const pulse = Math.sin(time / 180) * 2;

    ctx.save();
    ctx.shadowBlur = 22;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, radius + pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = .3;
    ctx.beginPath();
    ctx.arc(x, y, radius + 8 + pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawSnake() {
    snake.forEach((part, i) => {
        const x = part.x * CELL;
        const y = part.y * CELL;
        const gap = 3;

        const gradient = ctx.createLinearGradient(x, y, x + CELL, y + CELL);

        gradient.addColorStop(0, i === 0 ? "#a6f7ff" : "#38d9ff");
        gradient.addColorStop(1, i === 0 ? "#38d9ff" : "#3973ff");

        ctx.save();
        ctx.shadowBlur = i === 0 ? 20 : 10;
        ctx.shadowColor = "#38d9ff";
        ctx.fillStyle = gradient;

        ctx.beginPath();
        ctx.roundRect(
            x + gap,
            y + gap,
            CELL - gap * 2,
            CELL - gap * 2,
            7
        );
        ctx.fill();

        ctx.restore();

        if (i === 0) {
            ctx.fillStyle = "#07101c";

            let eyes;

            if (direction.x !== 0) {
                eyes = [
                    [x + 15, y + 8],
                    [x + 15, y + 17]
                ];
            } else {
                eyes = [
                    [x + 8, y + 15],
                    [x + 17, y + 15]
                ];
            }

            eyes.forEach(([ex, ey]) => {
                ctx.beginPath();
                ctx.arc(ex, ey, 2.3, 0, Math.PI * 2);
                ctx.fill();
            });
        }
    });
}

function drawParticles(delta) {
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= delta / 500;

        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
}

function draw(time, delta) {
    ctx.clearRect(0, 0, SIZE, SIZE);

    drawGrid();

    drawOrb(food, "#38d9ff", 7, time);

    if (bonus) {
        drawOrb(bonus, "#b18aff", 9, time);
    }

    drawSnake();
    drawParticles(delta);
}

function loop(time = 0) {
    const delta = Math.min(time - lastTime, 50);
    lastTime = time;

    if (running && !paused) {
        elapsed += delta;

        const speed = Math.max(65, 145 - score * 0.65);

        if (bonus) {
            bonusTimer -= delta / 1000;

            if (bonusTimer <= 0) {
                bonus = null;
            }
        }

        if (elapsed >= speed) {
            update();
            elapsed = 0;
        }
    }

    draw(time, delta);
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
